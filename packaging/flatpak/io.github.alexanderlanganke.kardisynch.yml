app-id: io.github.alexanderlanganke.kardisynch
runtime: org.freedesktop.Platform
runtime-version: '25.08'
sdk: org.freedesktop.Sdk
command: kardisynch
finish-args:
  - --share=ipc
  # Device news and the manufacturer MRI/advisory links.
  - --share=network
  - --socket=x11
  - --socket=wayland
  - --device=dri
  # The data root, the import folder and the USB/SMB sources are chosen by the user in Settings, so
  # the home folder and the usual mount points of removable drives and shares must be reachable.
  - --filesystem=home
  - --filesystem=/run/media
  - --filesystem=/media
  - --filesystem=/mnt
  # The local index and settings live in the app's own data folder ($XDG_DATA_HOME/kardisynch, chosen by
  # appStateDir() because FLATPAK_ID is set), never in the real ~/.kardisynch of another copy of the app.
modules:
  - name: kardisynch
    buildsystem: simple
    build-commands:
      - cp -r kardisynch /app/kardisynch
      - mkdir -p /app/bin
      - ln -s /app/kardisynch/bin/kardisynch /app/bin/kardisynch
      - install -Dm644 icons/kardisynch.png /app/share/icons/hicolor/256x256/apps/io.github.alexanderlanganke.kardisynch.png
      - install -Dm644 io.github.alexanderlanganke.kardisynch.desktop /app/share/applications/io.github.alexanderlanganke.kardisynch.desktop
      - install -Dm644 io.github.alexanderlanganke.kardisynch.metainfo.xml /app/share/metainfo/io.github.alexanderlanganke.kardisynch.metainfo.xml
    sources:
      - type: dir
        path: ../../apps/desktopApp/build/compose/binaries/main/app/kardisynch
        dest: kardisynch
      - type: dir
        path: icons
        dest: icons
      - type: file
        path: io.github.alexanderlanganke.kardisynch.desktop
      - type: file
        path: io.github.alexanderlanganke.kardisynch.metainfo.xml
