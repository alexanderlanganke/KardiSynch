org.gradle.jvmargs=-Xmx3g -Dfile.encoding=UTF-8
kotlin.daemon.jvmargs=-Xmx3g
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configureondemand=true
kotlin.code.style=official
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.mpp.enableCInteropCommonization=true
# AGP 9 no longer allows com.android.library + org.jetbrains.kotlin.multiplatform together
# without this bypass (matches essentials_suite's own gradle.properties).
android.builtInKotlin=false
android.newDsl=false

# The app's release version: shown in About, compared by the updater, used for the installer name.
# Release tags are v<this>. The Electron line was v2.x, so native releases start at 3.0.0.
kardisynch.version=3.0.3
