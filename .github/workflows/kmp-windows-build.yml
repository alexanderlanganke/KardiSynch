name: KMP Windows Desktop Build

# Manual only: jpackage bundles a platform-native runtime image, so a
# Windows .exe can only be produced by actually running the build ON
# Windows — Compose Desktop can't cross-compile it from Linux (see the
# comment on apps/desktopApp/build.gradle.kts's nativeDistributions block,
# issue #182). This gives an on-demand way to get a real Windows build
# without needing a Windows machine, without adding Windows packaging to
# every push (windows-latest runners are slower/costlier than Linux ones).
on:
  workflow_dispatch:

jobs:
  build:
    name: Build Windows app image
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # An app-image (createReleaseDistributable), not an installer: it
      # needs no WiX/Inno Setup toolchain and produces a folder with a
      # ready-to-run .exe plus a bundled JRE — exactly what "let me try
      # it" needs. A signed .msi installer is separate follow-up work
      # (issue #182) once there's a code-signing cert to use.
      - name: Build Windows app image
        run: .\gradlew.bat :apps:desktopApp:createReleaseDistributable

      # jlink's runtime image drops the loose VC++ runtime DLLs
      # (msvcp140.dll etc.) that the full JDK ships in its own bin\ —
      # it only carries over module-specific natives. The app-image
      # still launches on this runner because windows-latest has the
      # VC++ redistributable installed system-wide, masking the gap.
      # A target machine without that redistributable (and without
      # admin rights to install it) hits "Java virtual machine failed
      # to launch". Fix: copy the DLLs app-local — Microsoft's
      # documented no-installer redistribution method.
      #
      # Where "app-local" means matters: Windows resolves an implicitly
      # loaded DLL's own dependencies relative to the directory
      # containing *that* DLL, not the main .exe's directory. jvm.dll
      # (the HotSpot binary that actually links against the VC++ CRT)
      # lives in runtime\bin\server\, not runtime\bin\ itself, so a
      # copy into bin\ alone never lands next to the file that needs
      # it. Copy next to every jvm.dll found under the runtime image
      # (covers both the server and, if ever present, client VM), plus
      # bin\ itself since java.dll/jli.dll sit there directly.
      - name: Bundle VC++ runtime DLLs app-local
        shell: pwsh
        run: |
          $runtimeRoot = "apps/desktopApp/build/compose/binaries/main-release/app/kardisynch/runtime"
          $runtimeBin = Join-Path $runtimeRoot "bin"
          $jdkBin = Join-Path $env:JAVA_HOME "bin"
          $dlls = @("msvcp140.dll", "vcruntime140.dll", "vcruntime140_1.dll")

          $targetDirs = @($runtimeBin)
          $targetDirs += Get-ChildItem -Path $runtimeRoot -Recurse -Filter "jvm.dll" |
            ForEach-Object { $_.DirectoryName } |
            Sort-Object -Unique

          foreach ($dll in $dlls) {
            $src = Join-Path $jdkBin $dll
            if (-not (Test-Path $src)) {
              Write-Warning "Expected VC++ runtime DLL not found in JDK bin: $dll"
              continue
            }
            foreach ($dir in $targetDirs) {
              Copy-Item $src $dir -Force
            }
          }

      - name: Zip app image
        shell: bash
        run: |
          cd apps/desktopApp/build/compose/binaries/main-release/app
          7z a -tzip kardisynch-windows.zip kardisynch

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: kardisynch-windows
          path: apps/desktopApp/build/compose/binaries/main-release/app/kardisynch-windows.zip
          retention-days: 14
